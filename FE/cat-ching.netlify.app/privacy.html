        privacy_title: {ko:"개인정보처리방침", en:"Privacy Policy"},
        section1_title: {ko:"1. 개인정보의 처리 목적", en:"1. Purpose of Processing Personal Information"},
        section1_content: {ko:"Cat-ching은 로그인 기능과 Notion 연동 기능 제공을 위해 최소한의 개인정보를 수집하며, 명시한 목적 외에는 사용하지 않습니다.", en:"Cat-ching collects only the minimum personal information necessary to provide login and Notion integration features, and does not use the collected data for any purpose other than those explicitly stated."},
        section2_title: {ko:"2. 개인정보의 처리 및 보유 기간", en:"2. Retention Period"},
        section2_content: {ko:"개인정보는 회원 탈퇴 시 즉시 파기하며, 법령에 따른 보관 기간이 필요한 경우 해당 기간 동안 보관합니다.", en:"Personal information is destroyed immediately upon account deletion unless retention is required by law."},
        section3_title: {ko:"3. 처리하는 개인정보 항목", en:"3. Items of Personal Information Processed"},
        section3_line1: {ko:"수집 항목은 다음과 같습니다:", en:"Collected items are as follows:"},
        section3_line2: {ko:"로그인 정보: 이메일, 프로필 이름(구글 로그인 시)", en:"Login info: Email, profile name (Google login)"},
        section3_line3: {ko:"서비스 이용 정보: 검색한 회사명, 직무명, 분석 요청 기록", en:"Usage info: Company names, job roles, analysis request logs"},
        section4_title: {ko:"4. 개인정보의 파기 절차 및 방법", en:"4. Destruction of Personal Information"},
        section4_content: {ko:"보유 기간이 지난 개인정보는 복구 불가능한 방식으로 즉시 삭제합니다.", en:"Personal data beyond retention periods is permanently destroyed using secure methods."},
        section5_title: {ko:"5. 정보주체의 권리와 행사방법", en:"5. Rights of Data Subjects"},
        section5_content: {ko:"정보주체는 개인정보 열람·정정·삭제·처리정지 요청을 이메일로 제출할 수 있습니다.", en:"Users may request access, correction, deletion, or suspension of personal data via email."},
        section6_title: {ko:"6. 개인정보의 안전성 확보 조치", en:"6. Security Measures"},
        section6_content: {ko:"암호화, 접근 권한 통제, 보안 점검 등 개인정보보호를 위한 조치를 시행하고 있습니다.", en:"Security measures such as encryption, access control, and security audits are applied."},
        section7_title: {ko:"7. 책임자 정보 및 적용 일자", en:"7. Responsible Officer and Effective Date"},
        section7_content: {ko:"본 개인정보처리방침은 『개인정보 보호법』 제30조에 따라 수립되었으며 Cat-ching 서비스의 개인정보 처리 기준을 포함합니다. 본 방침은 2025년 11월 15일부터 적용됩니다.", en:"This Privacy Policy is established in accordance with Article 30 of the Personal Information Protection Act. It is effective from November 15, 2025."},
        section7_responsible: {ko:"▶ 개인정보 보호책임자", en:"▶ Personal Information Protection Officer"},
        section7_name: {ko:"성명: 서성우", en:"Name: Seongwoo Seo"},
        section7_position: {ko:"직책: 개인정보보호책임자", en:"Position: Personal Information Officer"},
        section7_contact: {ko:"연락처: team2eroom@gmail.com", en:"Contact: team2eroom@gmail.com"},
        section7_note: {ko:"※ 개인정보 관련 문의는 이메일로 접수하실 수 있습니다.", en:"※ For any privacy inquiries, please contact via email."},
        section8_title: {ko:"8. 권익침해 구제 방법", en:"8. Remedies"},
        section8_content: {ko:"개인정보침해 관련 상담은 아래 기관을 통해 진행할 수 있습니다.", en:"For personal data infringement issues, you may contact the following:"},
        section8_list1: {ko:"1. 개인정보분쟁조정위원회: 1833-6972 / www.kopico.go.kr", en:"1. Personal Information Dispute Mediation Committee: 1833-6972 / www.kopico.go.kr"},
        section8_list2: {ko:"2. 개인정보침해신고센터: 118 / privacy.kisa.or.kr", en:"2. Privacy Infringement Center: 118 / privacy.kisa.or.kr"},
        section8_list3: {ko:"3. 대검찰청 사이버수사과: 1301 / www.spo.go.kr", en:"3. Supreme Prosecutors' Office Cyber Unit: 1301 / www.spo.go.kr"},
        section8_list4: {ko:"4. 경찰청 사이버안전국: 182 / ecrm.cyber.go.kr", en:"4. National Police Cyber Bureau: 182 / ecrm.cyber.go.kr"},
        section8_right: {ko:"권리가 침해된 경우 행정심판을 제기할 수 있습니다.", en:"You may file an administrative appeal if your rights are violated."},
        section8_link: {ko:"※ 자세한 내용은 www.simpan.go.kr 에서 확인할 수 있습니다.", en:"※ Details are available at www.simpan.go.kr."},

        footer_privacy: {ko:"개인정보처리방침", en:"Privacy Policy"},
        footer_terms: {ko:"서비스 이용약관", en:"Terms of Service"}
      };

      function changeLanguage(lang){
        document.querySelectorAll("[data-i18n]").forEach(el=>{
          const key = el.getAttribute("data-i18n");
          if(translations[key]) el.textContent = translations[key][lang] || translations[key]["ko"];
        });
      }

      const userLang = navigator.language.startsWith("en") ? "en" : "ko";
      const langSelect = document.getElementById("langSelect");
      langSelect.value = userLang;
      changeLanguage(userLang);

      // 언어 선택 변경 시 즉시 반영되도록 이벤트 리스너 추가
      langSelect.addEventListener("change", (e) => {
        const newLang = e.target.value || "ko";
        changeLanguage(newLang);
        // 모바일 메뉴 선택 동기화
        const mobileSel = document.getElementById('langSelectMobile');
        if(mobileSel) mobileSel.value = newLang;
      });

      // 모바일 메뉴 토글 및 모바일 언어 선택 동작
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      const langSelectMobile = document.getElementById('langSelectMobile');
      if(mobileMenuBtn && mobileMenu){
        mobileMenuBtn.addEventListener('click', ()=> mobileMenu.classList.toggle('hidden'));
        mobileMenu.querySelectorAll('a').forEach(a=> a.addEventListener('click', ()=> mobileMenu.classList.add('hidden')));
      }
      if(langSelectMobile){
        langSelectMobile.value = userLang;
        langSelectMobile.addEventListener('change', e=>{
          const v = e.target.value || 'ko';
          changeLanguage(v);
          langSelect.value = v;
        });
      }
    </script>
