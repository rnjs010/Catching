<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="oauth-result" content="success">
  <title>Notion 연동</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
      background-color: #ffffff;
      color: #37352f;
    }

    .wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 400px;
    }

    .logo-container {
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .notion-logo {
      width: 48px;
      height: 48px;
    }

    .logo-divider {
      width: 1px;
      height: 32px;
      background-color: #e3e2e0;
    }

    .app-logo {
      font-size: 24px;
      font-weight: 600;
      color: #37352f;
    }

    .app-logo-c {
      color: #0058CC;
    }

    .status-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      background-color: #dbeddb;
      animation: scaleIn 0.3s ease-out;
    }

    .status-icon svg {
      width: 32px;
      height: 32px;
      color: #0f7b0f;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #37352f;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .description {
      font-size: 14px;
      color: #787774;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .progress-container {
      width: 100%;
      height: 4px;
      background-color: #f1f1ef;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-bar {
      height: 100%;
      background-color: #2eaadc;
      border-radius: 2px;
      animation: progress 3s linear forwards;
    }

    @keyframes progress {
      from { width: 0%; }
      to { width: 100%; }
    }

    .countdown {
      font-size: 12px;
      color: #a5a29a;
      margin-bottom: 8px;
    }

    .close-notice {
      font-size: 12px;
      color: #a5a29a;
      margin-top: 8px;
      visibility: hidden;
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="container">
    <div class="logo-container">
      <svg class="notion-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6.017 4.313l55.333 -4.087c6.797 -0.583 8.543 -0.19 12.817 2.917l17.663 12.443c2.913 2.14 3.883 2.723 3.883 5.053v68.243c0 4.277 -1.553 6.807 -6.99 7.193L24.467 99.967c-4.08 0.193 -6.023 -0.39 -8.16 -3.113L3.3 79.94c-2.333 -3.113 -3.3 -5.443 -3.3 -8.167V11.113c0 -3.497 1.553 -6.413 6.017 -6.8z" fill="#ffffff"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M61.35 0.227l-55.333 4.087C1.553 4.7 0 7.617 0 11.113v60.66c0 2.723 0.967 5.053 3.3 8.167l13.007 16.913c2.137 2.723 4.08 3.307 8.16 3.113l64.257 -3.89c5.433 -0.387 6.99 -2.917 6.99 -7.193V20.64c0 -2.21 -0.873 -2.847 -3.443 -4.733L74.167 3.143c-4.273 -3.107 -6.02 -3.5 -12.817 -2.917zM25.92 19.523c-5.247 0.353 -6.437 0.433 -9.417 -1.99L8.927 11.507c-0.77 -0.78 -0.383 -1.753 1.557 -1.947l53.193 -3.887c4.467 -0.39 6.793 1.167 8.54 2.527l9.123 6.61c0.39 0.197 1.36 1.36 0.193 1.36l-54.933 3.307 -0.68 0.047zM19.803 88.3V30.367c0 -2.53 0.777 -3.697 3.103 -3.893L86 22.78c2.14 -0.193 3.107 1.167 3.107 3.693v57.547c0 2.53 -0.39 4.67 -3.883 4.863l-60.377 3.5c-3.493 0.193 -5.043 -0.97 -5.043 -4.083zm59.6 -54.827c0.387 1.75 0 3.5 -1.75 3.7l-2.91 0.577v42.773c-2.527 1.36 -4.853 2.137 -6.797 2.137 -3.107 0 -3.883 -0.973 -6.21 -3.887l-19.03 -29.94v28.967l6.02 1.363s0 3.5 -4.857 3.5l-13.39 0.777c-0.39 -0.78 0 -2.723 1.357 -3.11l3.497 -0.97v-38.3L30.48 40.667c-0.39 -1.75 0.58 -4.277 3.3 -4.473l14.367 -0.967 19.8 30.327v-26.83l-5.047 -0.58c-0.39 -2.143 1.163 -3.7 3.103 -3.89l13.4 -0.78z" fill="#000000"/>
      </svg>
      <div class="logo-divider"></div>
      <span class="app-logo"><span class="app-logo-c">C</span>at-ching</span>
    </div>

    <div class="status-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1 class="title">Notion 연동 완료!</h1>
    <p class="description">
      이제 Cat-ching에서 분석 결과를<br>
      Notion으로 내보낼 수 있습니다.
    </p>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
    <p class="countdown"><span id="seconds">3</span>초 후 자동으로 닫힙니다</p>

    <p class="close-notice" id="close-notice">탭이 닫히지 않았다면 직접 닫아주세요</p>
  </div>
</div>

<script>
  let seconds = 3;
  const countdownEl = document.getElementById('seconds');
  const closeNotice = document.getElementById('close-notice');

  const timer = setInterval(() => {
    seconds--;
    countdownEl.textContent = seconds;

    if (seconds <= 0) {
      clearInterval(timer);
      window.close();

      setTimeout(() => {
        closeNotice.style.visibility = 'visible';
      }, 1000);
    }
  }, 1000);
</script>
</body>
</html>
