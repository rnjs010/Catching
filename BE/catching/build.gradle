plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dongledungle'
version = '0.0.1-SNAPSHOT'
description = 'AI-based job preparation services'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

jar {
    enabled = false
}
bootJar {
    enabled = true
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'com.google.genai:google-genai:1.35.0'
	implementation 'com.google.code.gson:gson'
	implementation 'com.google.guava:guava:33.0.0-jre'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	runtimeOnly 'org.postgresql:postgresql'
	// 스프링 시큐리티 (SecurityConfig, 필터)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// validation (@Valid 등)
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// OAuth2 클라이언트 (구글 로그인 실제 연동 시 사용할 수도 있음)
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// 테스트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// PDF Export
	implementation 'org.xhtmlrenderer:flying-saucer-pdf-openpdf:9.1.22'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.commonmark:commonmark:0.21.0'

	// Tess4J (Tesseract OCR Fallback)
	implementation 'net.sourceforge.tess4j:tess4j:5.4.0'
	implementation 'commons-io:commons-io:2.18.0'

	// Resilience4j Circuit Breaker & AOP
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
}

tasks.named('test') {
	useJUnitPlatform()
}
